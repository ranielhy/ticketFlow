services:
  db:
    image: postgres:17
    container_name: ticket_flow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_flow_development
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: development
    container_name: ticket_flow_web
    command: bash -lc "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/rails
    ports:
      - "3005:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    depends_on:
      - db

volumes:
  postgres_data:
